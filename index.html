/* ===== ORDRE D'AFFICHAGE DES RESSOURCES D'UN COURS =====
   Vidéo, Podcast, Résumé, Diapos, puis le reste. */
function resRank(r){
  const l=(r.label||'').toLowerCase();
  if(r.type==='video') return 0;
  if(r.type==='audio') return 1;
  if(l.startsWith('résumé')||l.startsWith('resume')) return 2;
  if(l.startsWith('diapo')) return 3;
  return 4;
}

   Admin voit tout.

   Exception unique 2025-2026 : ils voient aussi les ressources 2026-2027
   (décision coordonnateur — incitation à la réinscription).
   Les promos futures (2027-2028, etc.) ne voient QUE leur propre promo. */
function canSeeResource(res, user) {
  if (!user) return false;
  if (user.isAdmin) return true;
  const rp = res.promo || '2026-2027';   // ressources sans tag = 2026-2027 par défaut
  if (rp === user.promo) return true;
  if (user.promo === '2025-2026' && rp === '2026-2027') return true;
  return false;
}

/* ===== STARS COMPONENT ===== */
function Stars({value, onChange, readOnly}){
  const [hover, setHover] = React.useState(0);
  return (
    <div className="stars-row">
      {[1,2,3,4,5].map(n=>(
        <span key={n} className="star"
          style={{color:(hover||value||0)>=n?'#F59E0B':'#D1D5DB'}}
          onClick={()=>!readOnly&&onChange&&onChange(n)}
          onMouseEnter={()=>!readOnly&&setHover(n)}
          onMouseLeave={()=>!readOnly&&setHover(0)}>
          ★
        </span>
      ))}
    </div>
  );
}

    </a>
  );
}

/* ===== ACCOUNT RECOVERY COMPONENT ===== */
function AccountRecovery({onBack, onRecover}){
  const [email, setEmail] = React.useState('');
  const [status, setStatus] = React.useState(null);
  const [loading, setLoading] = React.useState(false);

  const recover = async () => {
    if(!email||!/\S+@\S+\.\S+/.test(email)){setStatus({type:'error',msg:'Email invalide.'});return;}
    setLoading(true); setStatus(null);
    try{
      const snap = await db.collection("participants").where("email","==",email.trim().toLowerCase()).limit(1).get();
      if(snap.empty){setStatus({type:'error',msg:"Aucun compte trouvé pour cet email. Vérifiez l'adresse ou créez un nouveau profil."});}
      else{
        const user = {id:snap.docs[0].id,...snap.docs[0].data()};
        saveLocalUser(user);
        setStatus({type:'success',msg:`Compte retrouvé ! Bienvenue, ${user.prenom} ${user.nom} (Promo ${user.promo}).`});
        setTimeout(()=>onRecover(user),1500);
      }
    }catch(e){setStatus({type:'error',msg:"Erreur : "+e.message});}
    setLoading(false);
  };
  return (
    <div style={{maxWidth:480,margin:'0 auto'}}>
      <div className="card">
        <div className="card-header" style={{background:'linear-gradient(135deg,#EFF6FF,#fff)',borderTop:'3px solid var(--s1)'}}>
          <h3 style={{fontSize:'1.05rem',fontWeight:700}}>🔑 Se connecter</h3>
          <p style={{fontSize:'.82rem',color:'var(--gray-500)',marginTop:'.25rem'}}>Saisissez votre email d'inscription pour restaurer votre profil</p>
        </div>
        <div className="card-body">
          {status&&<div className={`alert alert-${status.type==='success'?'success':'error'}`}><span>{status.type==='success'?'✅':'⚠️'}</span>{status.msg}</div>}
          <div className="form-group">
            <label>Adresse email</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
              placeholder="votre.email@exemple.fr" onKeyDown={e=>e.key==='Enter'&&recover()}/>
          </div>
          <div style={{display:'flex',gap:'.75rem'}}>
            <button className="btn btn-secondary" onClick={onBack} style={{flex:1,justifyContent:'center'}}>← Retour</button>
            <button className="btn btn-primary" onClick={recover} disabled={loading} style={{flex:2,justifyContent:'center'}}>
              {loading?<><span className="spinner"></span> Connexion...</>:'🔍 Se connecter'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ===== QUESTIONNAIRE COMPONENT ===== */
function Questionnaire({user}){
  const alreadyDone = hasSubmitted(user.promo);
  const [submitted, setSubmitted] = React.useState(alreadyDone);
  const [general, setGeneral] = React.useState({org:0,support:0,inter:0,global:0});
  const [courses, setCourses] = React.useState({});
  const [texts, setTexts] = React.useState({points_forts:'',points_amelio:'',suggestions:''});
  const [saving, setSaving] = React.useState(false);
  const [err, setErr] = React.useState('');
  const [openSess, setOpenSess] = React.useState(null);

  const setGenStar = (k,v) => setGeneral(g=>({...g,[k]:v}));
  const setCourseField = (cid,field,val) => setCourses(c=>({...c,[cid]:{...c[cid],[field]:val}}));

  const totalFilled = Object.values(courses).filter(c=>c.stars>0).length;
  const totalCourses = SESSIONS.reduce((a,s)=>a+s.courses.length,0);

  const submit = async() => {
    if(!general.global){setErr("Merci de donner au moins une note globale.");return;}
    setSaving(true); setErr('');
    try{
      const data = {
        userId:user.id, promo:user.promo,
        general, courses, texts,
        submittedAt:firebase.firestore.FieldValue.serverTimestamp()
      };
      await db.collection("responses").add(data);
      markSubmitted(user.promo);
      setSubmitted(true);
    }catch(e){setErr("Erreur: "+e.message);}
    setSaving(false);
  };

  if(submitted) return (
    <div className="card" style={{textAlign:'center',padding:'3rem 2rem'}}>
      <div style={{fontSize:'4rem',marginBottom:'1rem'}}>🎉</div>
      <h2 style={{fontSize:'1.5rem',fontWeight:800,marginBottom:.75+'rem'}}>Merci pour votre évaluation !</h2>
      <p style={{color:'var(--gray-500)'}}>Vos réponses ont été enregistrées pour la promotion {user.promo}.</p>
    </div>
  );

  return (
    <div>
      <div className="alert alert-info">
        <span>ℹ️</span>
        <span>Promotion <strong>{user.promo}</strong> — {totalFilled}/{totalCourses} cours évalués. La note globale est obligatoire.</span>
      </div>

      {/* Notes générales */}
      <div className="card">
        <div className="card-header" style={{background:'linear-gradient(135deg,#F5F3FF,#fff)',borderTop:'3px solid var(--primary)'}}>
          <h3 style={{fontWeight:700}}>⭐ Évaluation générale</h3>
        </div>
        <div className="card-body">
          {[
            {k:'org',label:'Organisation de la formation'},
            {k:'support',label:'Qualité des supports pédagogiques'},
            {k:'inter',label:'Interactivité et échanges'},
            {k:'global',label:'Satisfaction globale *'}
          ].map(({k,label})=>(
            <div key={k} style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'.85rem',flexWrap:'wrap',gap:'.5rem'}}>
              <span style={{fontSize:'.9rem',fontWeight:k==='global'?700:500}}>{label}</span>
              <Stars value={general[k]} onChange={v=>setGenStar(k,v)}/>
            </div>
          ))}
          <hr className="divider"/>
          {[
            {k:'points_forts',label:'Points forts de la formation',ph:'Ce qui vous a le plus apporté...'},
            {k:'points_amelio',label:"Points à améliorer",ph:'Suggestions concrètes...'},
            {k:'suggestions',label:'Suggestions libres',ph:'Vos idées pour la prochaine promotion...'}
          ].map(({k,label,ph})=>(
            <div key={k} className="form-group">
              <label>{label}</label>
              <textarea rows={3} value={texts[k]} onChange={e=>setTexts(t=>({...t,[k]:e.target.value}))} placeholder={ph}/>
            </div>
          ))}
        </div>
      </div>

      {/* Cours par session */}
      {SESSIONS.map(sess=>{
        const col = sessionColor(sess.num);
        const isOpen = openSess===sess.id;
        const sessRated = sess.courses.filter(c=>courses[c.id]?.stars>0).length;
        return (
          <div key={sess.id} className={`card ${col}-card`}>
            <div className="card-header" style={{cursor:'pointer'}} onClick={()=>setOpenSess(isOpen?null:sess.id)}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <div style={{display:'flex',alignItems:'center',gap:'.75rem'}}>
                  <span className={`session-badge ${col}-badge`}>{sess.id}</span>
                  <span style={{fontWeight:700,fontSize:'.95rem'}}>{SESSION_NAMES[sess.num]}</span>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:'.75rem'}}>
                  <span style={{fontSize:'.78rem',color:'var(--gray-500)'}}>{sessRated}/{sess.courses.length} évalués</span>
                  <span style={{fontSize:'1.2rem'}}>{isOpen?'▲':'▼'}</span>
                </div>
              </div>
              {sessRated>0&&<div className="progress-bar" style={{marginTop:'.75rem'}}>
                <div className="progress-fill" style={{width:`${(sessRated/sess.courses.length)*100}%`}}/>
              </div>}
            </div>
            {isOpen&&<div className="card-body">
              {sess.courses.map(c=>{
                const cv = courses[c.id]||{stars:0,comment:''};
                const hasRes = DROPBOX_RESOURCES[c.id]&&DROPBOX_RESOURCES[c.id].length>0;
                return (
                  <div key={c.id} style={{marginBottom:'1.25rem',paddingBottom:'1.25rem',borderBottom:'1px solid var(--gray-100)'}}>

                        <div style={{fontSize:'.78rem',color:'var(--gray-500)',marginTop:'.15rem'}}>{c.teacher}</div>
                        {hasRes&&DROPBOX_RESOURCES[c.id].map((r,i)=>(
                          <ResourceItem key={i} res={r}/>

                      <div style={{textAlign:'right',flexShrink:0}}>

                      value={cv.comment||''} onChange={e=>setCourseField(c.id,'comment',e.target.value)}
                      placeholder="Commentaire optionnel sur ce cours..."/>
                  </div>
                );
              })}
            </div>}
          </div>
        );
      })}

      {err&&<div className="alert alert-error"><span>⚠️</span>{err}</div>}
      <button className="btn btn-primary" onClick={submit} disabled={saving}
        style={{width:'100%',justifyContent:'center',padding:'1rem',fontSize:'1rem',marginBottom:'2rem'}}>
        {saving?<><span className="spinner"></span> Envoi...</>:`✓ Soumettre mon évaluation (Promo ${user.promo})`}
      </button>
    </div>
  );
}

/* ===== ANNUAIRE COMPONENT ===== */
function Annuaire({user}){
  const [list, setList] = React.useState([]);
  const [filter, setFilter] = React.useState({promo:'',search:''});
  const [loading, setLoading] = React.useState(true);
  const [msgModal, setMsgModal] = React.useState(null);
  const [msgText, setMsgText] = React.useState('');
  const [sending, setSending] = React.useState(false);

  React.useEffect(()=>{
    /* Pas d'orderBy côté Firestore : filtre + tri exigerait un index composite.
       Le tri alphabétique est fait dans le navigateur. */
    return db.collection("participants").where("inDirectory","==",true).onSnapshot(snap=>{
      const rows = snap.docs.map(d=>({id:d.id,...d.data()}));
      rows.sort((a,b)=>`${a.nom||''} ${a.prenom||''}`.localeCompare(`${b.nom||''} ${b.prenom||''}`,'fr',{sensitivity:'base'}));
      setList(rows);
      setLoading(false);
    }, err=>{
      console.error('Annuaire :', err);
      setList([]);
      setLoading(false);
    });
  },[]);

  const sendMsg = async(to) => {
    if(!msgText.trim()) return;
    setSending(true);
    try{
      await db.collection("messages").add({
        fromId:user.id, fromName:`${user.prenom} ${user.nom}`,
        toId:to.id, toName:`${to.prenom} ${to.nom}`,
        text:msgText.trim(),
        read:false,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      await sendEmailNotif(to.email,`${to.prenom} ${to.nom}`,`${user.prenom} ${user.nom}`,msgText.trim());
      setMsgModal(null); setMsgText('');
    }catch(e){console.error(e);}
    setSending(false);
  };

  /* Le participant connecté apparaît aussi (en tête, marqué « Vous »),
     pour qu'il voie sa fiche et que l'annuaire ne paraisse pas vide. */
  const filtered = list.filter(p=>{
    if(filter.promo && p.promo!==filter.promo) return false;
    if(filter.search){
      const q=filter.search.toLowerCase();
      return `${p.prenom} ${p.nom} ${p.profession} ${p.lieu}`.toLowerCase().includes(q);
    }
    return true;
  }).sort((a,b)=>(b.id===user.id)-(a.id===user.id));
  const others = list.filter(p=>p.id!==user.id);
  const meListed = list.some(p=>p.id===user.id);

  return (
    <div>
      <div className="card">
        <div className="card-body" style={{display:'flex',gap:'.75rem',flexWrap:'wrap'}}>
          <input style={{flex:2,padding:'.6rem .9rem',border:'1.5px solid var(--gray-200)',borderRadius:'.6rem',fontSize:'.9rem'}}
            placeholder="🔍 Rechercher (nom, profession, ville...)" value={filter.search}
            onChange={e=>setFilter(f=>({...f,search:e.target.value}))}/>
          <select style={{flex:1,padding:'.6rem .9rem',border:'1.5px solid var(--gray-200)',borderRadius:'.6rem',fontSize:'.9rem'}}
            value={filter.promo} onChange={e=>setFilter(f=>({...f,promo:e.target.value}))}>
            <option value="">Toutes promotions</option>
            {PROMOS.map(p=><option key={p} value={p}>Promo {p}</option>)}
          </select>
        </div>
      </div>
      {loading?<div style={{textAlign:'center',padding:'2rem',color:'var(--gray-500)'}}>Chargement...</div>:
      <>
      {!meListed&&<div className="card"><div className="card-body" style={{fontSize:'.85rem',color:'var(--gray-500)'}}>
        Votre fiche n'apparaît pas dans l'annuaire : vous avez choisi de ne pas y figurer lors de votre inscription.
      </div></div>}
      {filtered.length===0?<div className="card"><div className="card-body" style={{textAlign:'center',color:'var(--gray-500)'}}>
        {(filter.search||filter.promo)?'Aucun participant ne correspond à votre recherche.':'Aucun participant inscrit dans l\'annuaire pour l\'instant.'}
      </div></div>:
      filtered.map(p=>(
        <div key={p.id} className="participant-card">
          <div style={{display:'flex',alignItems:'center',gap:'.75rem'}}>
            <div style={{width:'2.5rem',height:'2.5rem',borderRadius:'50%',background:'linear-gradient(135deg,var(--primary),#8B5CF6)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:700,fontSize:'1rem',flexShrink:0}}>
              {((p.prenom||'?')[0]).toUpperCase()}{((p.nom||'')[0]||'').toUpperCase()}
            </div>
            <div>
              <div style={{fontWeight:700}}>{p.prenom} {p.nom}</div>
              <div style={{fontSize:'.8rem',color:'var(--gray-500)'}}>{p.profession}{p.lieu?` — ${p.lieu}`:''}</div>
              <span className="chip" style={{marginTop:'.25rem'}}>Promo {p.promo}</span>
              {p.id===user.id&&<span className="chip" style={{marginTop:'.25rem',marginLeft:'.35rem',background:'#DCFCE7',color:'#166534'}}>Vous</span>}
            </div>
          </div>
          {p.id!==user.id&&<button className="btn btn-sm btn-primary" onClick={()=>setMsgModal(p)}>✉️ Message</button>}
        </div>
      ))}
      {others.length===0&&!filter.search&&!filter.promo&&<div className="card"><div className="card-body" style={{textAlign:'center',color:'var(--gray-500)',fontSize:'.9rem'}}>
        Aucun autre participant n'est encore inscrit. Les collègues apparaîtront ici au fur et à mesure de leur inscription.
      </div></div>}
      </>}
      {msgModal&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:'1rem'}}>
          <div className="card" style={{width:'100%',maxWidth:460,margin:0}}>
            <div className="card-header">
              <h3 style={{fontWeight:700}}>Message à {msgModal.prenom} {msgModal.nom}</h3>
            </div>
            <div className="card-body">
              <textarea rows={4} style={{width:'100%',padding:'.75rem',border:'1.5px solid var(--gray-200)',borderRadius:'.6rem',fontSize:'.9rem',fontFamily:'inherit'}}
                value={msgText} onChange={e=>setMsgText(e.target.value)} placeholder="Votre message..."/>
              <p style={{fontSize:'.75rem',color:'var(--gray-500)',marginTop:'.5rem'}}>
                💡 Un email de notification sera envoyé à {msgModal.prenom}.
              </p>

/* ===== MESSAGING COMPONENT ===== */
function Messaging({user}){
  const [threads, setThreads] = React.useState([]);
  const [active, setActive] = React.useState(null);
  const [msgs, setMsgs] = React.useState([]);
  const [reply, setReply] = React.useState('');
  const [sending, setSending] = React.useState(false);

  React.useEffect(()=>{
    const q = db.collection("messages").where("toId","==",user.id);
    return q.onSnapshot(snap=>{
      const byFrom={};
      snap.docs.forEach(d=>{
        const m={id:d.id,...d.data()};
        if(!byFrom[m.fromId]||m.createdAt>byFrom[m.fromId].createdAt) byFrom[m.fromId]=m;
      });
      setThreads(Object.values(byFrom).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)));
    }, err=>console.error('Messagerie :', err));
  },[user.id]);

  React.useEffect(()=>{
    if(!active) return;
    const q = db.collection("messages").where("toId","==",user.id).where("fromId","==",active.fromId);
    const q2 = db.collection("messages").where("fromId","==",user.id).where("toId","==",active.fromId);
    let u1=[], u2=[];
    const merge = () => {
      const all = [...u1,...u2].sort((a,b)=>(a.createdAt?.seconds||Infinity)-(b.createdAt?.seconds||Infinity));
      setMsgs(all);
    };
    const onErr = err=>console.error('Conversation :', err);
    const unsub1 = q.onSnapshot(s=>{u1=s.docs.map(d=>({id:d.id,...d.data()}));merge();}, onErr);
    const unsub2 = q2.onSnapshot(s=>{u2=s.docs.map(d=>({id:d.id,...d.data()}));merge();}, onErr);
    return()=>{unsub1();unsub2();};
  },[active]);

  const sendReply = async() => {
    if(!reply.trim()||!active) return;
    setSending(true);
    try{
      await db.collection("messages").add({
        fromId:user.id,fromName:`${user.prenom} ${user.nom}`,
        toId:active.fromId,toName:active.fromName,
        text:reply.trim(),read:false,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      await sendEmailNotif(active.fromEmail,active.fromName,`${user.prenom} ${user.nom}`,reply.trim());
      setReply('');
    }catch(e){console.error(e);}
    setSending(false);
  };

  if(active){
    return (
      <div>
        <button className="btn btn-secondary btn-sm" onClick={()=>setActive(null)} style={{marginBottom:'1rem'}}>← Retour aux conversations</button>
        <div className="card" style={{marginBottom:'.75rem'}}>
          <div className="card-header"><h3 style={{fontWeight:700}}>Conversation avec {active.fromName}</h3></div>
          <div className="card-body" style={{maxHeight:'50vh',overflowY:'auto'}}>
            {msgs.map(m=>(
              <div key={m.id} className={`msg-bubble ${m.fromId===user.id?'sent':'received'}`}>
                <div style={{fontSize:'.88rem'}}>{m.text}</div>
                <div style={{fontSize:'.7rem',opacity:.7,marginTop:'.3rem'}}>{m.createdAt?.toDate?.()?.toLocaleString('fr-FR')}</div>
              </div>
            ))}
          </div>
        </div>
        <div className="card">
          <div className="card-body">
            <textarea rows={3} style={{width:'100%',padding:'.65rem .9rem',border:'1.5px solid var(--gray-200)',borderRadius:'.6rem',fontSize:'.9rem',fontFamily:'inherit'}}
              value={reply} onChange={e=>setReply(e.target.value)} placeholder="Votre réponse..."/>
            <button className="btn btn-primary" onClick={sendReply} disabled={sending||!reply.trim()} style={{marginTop:'.5rem',width:'100%',justifyContent:'center'}}>
              {sending?<><span className="spinner"></span> Envoi...</>:'✈️ Envoyer la réponse'}
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      {threads.length===0?
        <div className="card"><div className="card-body" style={{textAlign:'center',color:'var(--gray-500)',padding:'2.5rem'}}>
          <div style={{fontSize:'2.5rem',marginBottom:'.75rem'}}>📭</div>
          <p>Aucun message reçu. Utilisez l'annuaire pour contacter des participants.</p>
        </div></div>:
        threads.map(t=>(
          <div key={t.fromId} className="participant-card" style={{cursor:'pointer'}} onClick={()=>setActive(t)}>
            <div style={{display:'flex',alignItems:'center',gap:'.75rem'}}>
              <div style={{width:'2.5rem',height:'2.5rem',borderRadius:'50%',background:'linear-gradient(135deg,var(--primary),#8B5CF6)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:700}}>
                {(t.fromName||'?')[0].toUpperCase()}
              </div>
              <div>
                <div style={{fontWeight:700}}>{t.fromName}</div>
                <div style={{fontSize:'.82rem',color:'var(--gray-500)'}}>{(t.text||'').substring(0,60)}...</div>
              </div>
            </div>
            {!t.read&&<span className="chip" style={{background:'#EFF6FF',color:'var(--primary)'}}>Nouveau</span>}
          </div>
        ))
      }
    </div>
  );
}

    return db.collection("resources").onSnapshot(snap=>{
      const m={};
      snap.docs.forEach(d=>{const r={id:d.id,...d.data()};if(!m[r.courseId])m[r.courseId]=[];m[r.courseId].push(r);});
      setFirestoreRes(m);
    });
  },[]);

  return (
    <div>
      <div className="alert alert-warning">
        <span>⚠️</span>
        <span>Les ressources Dropbox nécessitent que le lien soit configuré en <strong>"Toute personne disposant du lien"</strong> dans vos paramètres Dropbox.</span>

      {DROPBOX_RESOURCES['_S1_general']&&(
        <div className="card" style={{borderTop:'3px solid var(--primary)'}}>
          <div className="card-header" style={{background:'linear-gradient(135deg,#F5F3FF,#fff)'}}>

          </div>
          <div className="card-body">
            {DROPBOX_RESOURCES['_S1_general'].map((r,i)=><ResourceItem key={i} res={r}/>)}
          </div>
        </div>
      )}
      {SESSIONS.map(sess=>{
        const col = sessionColor(sess.num);
        const isOpen = openSess===sess.num;
        const hasAnyRes = sess.courses.some(c=>
          (DROPBOX_RESOURCES[c.id]||[]).some(r=>canSeeResource(r,user))||
          (firestoreRes[c.id]||[]).some(r=>canSeeResource(r,user))
        );
        return (
          <div key={sess.id} className={`card ${col}-card`}>
            <div className="card-header" style={{cursor:'pointer'}} onClick={()=>setOpenSess(isOpen?null:sess.num)}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <div style={{display:'flex',alignItems:'center',gap:'.75rem'}}>
                  <span className={`session-badge ${col}-badge`}>{sess.id}</span>
                  <span style={{fontWeight:700,fontSize:'.95rem'}}>{SESSION_NAMES[sess.num]}</span>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:'.5rem'}}>
                  {hasAnyRes&&<span className="chip" style={{background:'#DCFCE7',color:'#15803D'}}>Ressources ✓</span>}
                  <span style={{fontSize:'1.2rem'}}>{isOpen?'▲':'▼'}</span>
                </div>
              </div>
            </div>
            {isOpen&&<div className="card-body">
              {sess.courses.map(c=>{
                const dbxRes = (DROPBOX_RESOURCES[c.id]||[]).filter(r=>canSeeResource(r,user));
                const fsRes = (firestoreRes[c.id]||[]).filter(r=>canSeeResource(r,user));
                const allRes = [...dbxRes,...fsRes].sort((a,b)=>resRank(a)-resRank(b));
                const hasRes = allRes.length>0;
                return (
                  <div key={c.id} style={{
                    marginBottom:'.6rem',padding:'.75rem',borderRadius:'.6rem',
                    background: hasRes?'#F0FDF4':'#FFF1F2',
                    border: `1px solid ${hasRes?'#BBF7D0':'#FECDD3'}`
                  }}>
                    <div style={{display:'flex',alignItems:'center',gap:'.5rem',marginBottom:'.25rem'}}>
                      <span style={{fontSize:'.85rem'}}>{hasRes?'🟢':'🔴'}</span>
                      <span style={{fontWeight:600,fontSize:'.9rem'}}>{c.title}</span>
                    </div>
                    <div style={{fontSize:'.78rem',color:'var(--gray-500)',marginBottom:'.4rem'}}>{c.teacher}</div>
                    {hasRes?
                      allRes.map((r,i)=>(
                        <div key={i} style={{display:'flex',alignItems:'center',gap:'.4rem'}}>
                          <div style={{flex:1}}><ResourceItem res={r}/></div>

                );
              })}
            </div>}
          </div>
        );
      })}

      {/* Ressources hors programme (courseId non présent dans SESSIONS) */}
      {(()=>{
        const knownIds = new Set(SESSIONS.flatMap(s=>s.courses.map(c=>c.id)));
        const extraKeys = Object.keys(firestoreRes).filter(k=>!knownIds.has(k));
        const visibleExtras = extraKeys.filter(k=>(firestoreRes[k]||[]).some(r=>canSeeResource(r,user)));
        if(!visibleExtras.length) return null;
        return (
          <div className="card" style={{marginTop:'1rem'}}>

              {visibleExtras.map(k=>(
                <div key={k} style={{marginBottom:'.75rem',paddingBottom:'.75rem',borderBottom:'1px solid var(--gray-100)'}}>
                  <div style={{fontWeight:600,fontSize:'.9rem',marginBottom:'.4rem'}}>{k}</div>
                  {(firestoreRes[k]||[]).filter(r=>canSeeResource(r,user)).map((r,i)=>(
                    <div key={i} style={{display:'flex',alignItems:'center',gap:'.4rem'}}>
                      <div style={{flex:1}}><ResourceItem res={r}/></div>
                      {user.isAdmin&&r.id&&<button onClick={()=>deleteRes(r.id)} style={{background:'none',border:'none',cursor:'pointer',color:'#F43F5E',fontSize:'1rem',padding:'2px 4px',lineHeight:1}} title="Supprimer">✕</button>}
                    </div>
                  ))}
                </div>
              ))}
            </div>
          </div>
        );
      })()}
    </div>
  );
}

/* ===== ADMIN DASHBOARD COMPONENT ===== */
function AdminDash(){
  const [tab, setTab] = React.useState('overview');
  const [participants, setParticipants] = React.useState([]);
  const [responses, setResponses] = React.useState([]);
  const [summaries, setSummaries] = React.useState({...DEFAULT_SUMMARIES});
  const [editSummary, setEditSummary] = React.useState(null);
  const [summaryText, setSummaryText] = React.useState('');
  const [broadcast, setBroadcast] = React.useState({subject:'',body:'',filterPromo:'',filterSession:''});
  const [sending, setSending] = React.useState(false);
  const [broadcastStatus, setBroadcastStatus] = React.useState(null);
  const [resForm, setResForm] = React.useState({courseId:'',label:'',url:'',type:'pptx',promo:PROMOS[PROMOS.length-1],customCourseId:''});
  const [addingRes, setAddingRes] = React.useState(false);
  const chartRef = React.useRef(null);
  const chartInst = React.useRef(null);

  React.useEffect(()=>{
    const u1=db.collection("participants").orderBy("createdAt","desc").onSnapshot(s=>setParticipants(s.docs.map(d=>({id:d.id,...d.data()}))));
    const u2=db.collection("responses").orderBy("submittedAt","desc").onSnapshot(s=>setResponses(s.docs.map(d=>({id:d.id,...d.data()}))));
    db.collection("summaries").get().then(s=>{
      const m={...DEFAULT_SUMMARIES};
      s.docs.forEach(d=>{m[d.id]=d.data().text||m[d.id];});
      setSummaries(m);
    });
    return()=>{u1();u2();};
  },[]);

  React.useEffect(()=>{
    if(tab!=='analytics'||!chartRef.current) return;
    if(chartInst.current) chartInst.current.destroy();
    const sessionAvgs = SESSIONS.map(sess=>{
      const ids = sess.courses.map(c=>c.id);
      let total=0,count=0;
      responses.forEach(r=>{
        ids.forEach(cid=>{
          if(r.courses?.[cid]?.stars){total+=r.courses[cid].stars;count++;}
        });
      });
      return count>0?(total/count).toFixed(2):0;
    });
    chartInst.current = new Chart(chartRef.current,{
      type:'bar',
      data:{
        labels:SESSIONS.map(s=>s.id),
        datasets:[{label:'Note moyenne/5',data:sessionAvgs,
          backgroundColor:['#3B82F6','#0D9488','#8B5CF6','#F97316','#16A34A','#DB2777'],
          borderRadius:8}]
      },
      options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{min:0,max:5}}}
    });
  },[tab,responses]);

  const sendBroadcast = async() => {
    if(!broadcast.body.trim()||!broadcast.subject.trim()) return;
    setSending(true); setBroadcastStatus(null);
    try{
      let targets = [...participants];
      if(broadcast.filterPromo) targets=targets.filter(p=>p.promo===broadcast.filterPromo);
      if(!targets.length){setBroadcastStatus({type:'error',msg:'Aucun destinataire.'});setSending(false);return;}
      let sent=0,failed=0;
      for(const p of targets){
        if(!p.email) continue;
        try{
          if(EMAILJS_CONFIG.serviceId&&!EMAILJS_CONFIG.serviceId.startsWith("REMPLACER")){
            await emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, {
              to_email:p.email, to_name:`${p.prenom} ${p.nom}`,
              from_name:'Admin DIU TDAH',
              subject: broadcast.subject.trim(),
              message_preview:broadcast.body.substring(0,300),
              app_link: typeof APP_URL!=='undefined'?APP_URL:'(voir URL de l\'application)'
            });
          }
          await db.collection("messages").add({
            fromId:'admin',fromName:'Admin DIU TDAH',
            toId:p.id,toName:`${p.prenom} ${p.nom}`,
            text:broadcast.body.trim(),read:false,
            createdAt:firebase.firestore.FieldValue.serverTimestamp()
          });
          sent++;
        }catch(e){failed++;console.error(e);}
      }
      setBroadcastStatus({type:'success',msg:`Message envoyé à ${sent} participant(s).${failed?' '+failed+' échec(s).':''}`});
      setBroadcast(b=>({...b,body:'',subject:''}));
    }catch(e){setBroadcastStatus({type:'error',msg:e.message});}
    setSending(false);
  };

  const saveSummary = async(cid) => {
    await db.collection("summaries").doc(cid).set({text:summaryText,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    setSummaries(s=>({...s,[cid]:summaryText}));
    setEditSummary(null);
  };

  const [resError, setResError] = React.useState(null);
  const addResource = async() => {
    const effectiveCourseId = resForm.courseId==='__custom__' ? resForm.customCourseId.trim() : resForm.courseId;
    if(!effectiveCourseId||!resForm.label||!resForm.url) return;
    setAddingRes(true);
    setResError(null);
    try {
      const {customCourseId,...rest} = resForm;
      const timeout = new Promise((_,reject)=>setTimeout(()=>reject(new Error('Délai dépassé — vérifiez les règles Firestore (permission-denied ?)')),8000));
      await Promise.race([
        db.collection("resources").add({...rest,courseId:effectiveCourseId,createdAt:firebase.firestore.FieldValue.serverTimestamp()}),
        timeout
      ]);
      setResForm(f=>({...f,label:'',url:'',customCourseId:''}));
    } catch(e) {
      console.error('addResource error:', e);
      setResError('Erreur : ' + (e.message||e.code||'inconnue'));

      setAddingRes(false);
    }
  };

  const exportPDF = () => {

    doc.setFontSize(16);doc.text("Rapport DIU TDAH",14,18);

    doc.autoTable({startY:35,head:[['Prénom','Nom','Email','Profession','Promo']],
      body:participants.map(p=>[p.prenom,p.nom,p.email,p.profession,p.promo])});
    doc.save('rapport-diu-tdah.pdf');

  const promoStats = PROMOS.map(p=>({promo:p,count:participants.filter(x=>x.promo===p).length,responses:responses.filter(x=>x.promo===p).length}));

  return (
    <div>

        {[

          {value:responses.length,label:'Évaluations'},
          {value:globalAvg,label:'Moy. globale'},
          {value:`${promoStats[0]?.count||0}/${promoStats[1]?.count||0}`,label:'Promos 25-26/26-27'}
        ].map(s=>(
          <div key={s.label} className="stat-card">
            <div className="value">{s.value}</div><div className="label">{s.label}</div>
          </div>
        ))}
      </div>

      <div className="tab-pills">
        {[['overview','📊 Vue d\'ensemble'],['broadcast','📢 Diffusion'],['resources','📎 Ressources'],['summaries','🤖 Résumés IA'],['analytics','📈 Analytique']].map(([k,l])=>(
          <button key={k} className={`tab-pill ${tab===k?'active':''}`} onClick={()=>setTab(k)}>{l}</button>

      {tab==='overview'&&(

          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem',flexWrap:'wrap',gap:'.5rem'}}>
            <h3 style={{fontWeight:700}}>Participants ({participants.length})</h3>

          </div>
          {participants.map(p=>(
            <div key={p.id} className="participant-card">
              <div>
                <div style={{fontWeight:700}}>{p.prenom} {p.nom}</div>
                <div style={{fontSize:'.8rem',color:'var(--gray-500)'}}>{p.email} — {p.profession}</div>
                <span className="chip" style={{marginTop:'.25rem'}}>Promo {p.promo}</span>

              <span style={{fontSize:'.78rem',color:'var(--gray-400)'}}>{p.inDirectory?'📒 Annuaire':'🔒 Privé'}</span>
            </div>

      {tab==='broadcast'&&(

                    <input style={{marginTop:'.4rem'}} value={resForm.customCourseId}
                      onChange={e=>setResForm(f=>({...f,customCourseId:e.target.value}))}
                      placeholder="Identifiant ou titre du cours (ex: S3C1 ou Conférence TDAH adulte)"/>
                  )}
                </div>
                <div className="form-group">
                  <label>Type</label>
                  <select value={resForm.type} onChange={e=>setResForm(f=>({...f,type:e.target.value}))}>
                    {['pptx','pdf','video','audio','doc'].map(t=><option key={t} value={t}>{t.toUpperCase()}</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label>Promo</label>
                  <select value={resForm.promo} onChange={e=>setResForm(f=>({...f,promo:e.target.value}))}>
                    {PROMOS.map(p=><option key={p} value={p}>{p}</option>)}
                  </select>
                </div>
              </div>
              <div className="form-group"><label>Titre</label>
                <input value={resForm.label} onChange={e=>setResForm(f=>({...f,label:e.target.value}))} placeholder="Titre de la ressource"/>
              </div>
              <div className="form-group"><label>URL</label>
                <input value={resForm.url} onChange={e=>setResForm(f=>({...f,url:e.target.value}))} placeholder="https://www.dropbox.com/..."/>
              </div>
              <button className="btn btn-green" onClick={addResource} disabled={addingRes}>
                {addingRes?<span className="spinner"></span>:'+ Ajouter la ressource'}
              </button>
              {resError&&<div style={{marginTop:'.5rem',color:'#dc2626',fontSize:'.85rem',background:'#fef2f2',padding:'.5rem .75rem',borderRadius:'.4rem',border:'1px solid #fecaca'}}>{resError}</div>}
            </div>
          </div>
        </div>
      )}

      {tab==='summaries'&&(
        <div>
          {SESSIONS.flatMap(sess=>sess.courses.map(c=>(
            <div key={c.id} className="card" style={{marginBottom:'.75rem'}}>
              <div className="card-body">
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'1rem',marginBottom:'.5rem'}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:'.9rem'}}>{c.id} — {c.title}</div>
                    <div style={{fontSize:'.78rem',color:'var(--gray-500)'}}>{c.teacher}</div>
                  </div>
                  <button className="btn btn-sm btn-primary" onClick={()=>{setEditSummary(c.id);setSummaryText(summaries[c.id]||'')}}>
                    ✏️ Éditer
                  </button>
                </div>
                {editSummary===c.id?
                  <div>
                    <textarea rows={4} style={{width:'100%',padding:'.65rem .9rem',border:'1.5px solid var(--gray-200)',borderRadius:'.6rem',fontSize:'.88rem',fontFamily:'inherit'}}
                      value={summaryText} onChange={e=>setSummaryText(e.target.value)}/>
                    <div style={{display:'flex',gap:'.5rem',marginTop:'.5rem'}}>
                      <button className="btn btn-sm btn-green" onClick={()=>saveSummary(c.id)}>✓ Sauvegarder</button>
                      <button className="btn btn-sm btn-secondary" onClick={()=>setEditSummary(null)}>Annuler</button>
                    </div>
                  </div>:
                  <p style={{fontSize:'.82rem',color:'var(--gray-600)',lineHeight:1.55}}>{(summaries[c.id]||'').substring(0,200)}...</p>
                }
              </div>
            </div>
          )))}
        </div>
      )}

      {tab==='analytics'&&(
        <div>
          <div className="card" style={{marginBottom:'1rem'}}>
            <div className="card-header"><h3 style={{fontWeight:700}}>Notes moyennes par session</h3></div>
            <div className="card-body"><canvas ref={chartRef} height={220}/></div>
          </div>
          <div className="card">
            <div className="card-header"><h3 style={{fontWeight:700}}>Commentaires libres</h3></div>
            <div className="card-body">
              {responses.filter(r=>r.texts?.points_forts||r.texts?.suggestions).slice(0,15).map((r,i)=>(
                <div key={i} style={{padding:'.75rem',background:'var(--gray-50)',borderRadius:'.6rem',marginBottom:'.6rem'}}>
                  <div style={{fontSize:'.72rem',color:'var(--gray-400)',marginBottom:'.35rem'}}>Promo {r.promo} — {r.submittedAt?.toDate?.()?.toLocaleDateString('fr-FR')}</div>
                  {r.texts?.points_forts&&<p style={{fontSize:'.85rem',color:'#166534'}}><strong>✅ Points forts :</strong> {r.texts.points_forts}</p>}
                  {r.texts?.points_amelio&&<p style={{fontSize:'.85rem',color:'#92400E',marginTop:'.35rem'}}><strong>⚠️ À améliorer :</strong> {r.texts.points_amelio}</p>}
                  {r.texts?.suggestions&&<p style={{fontSize:'.85rem',color:'#1E40AF',marginTop:'.35rem'}}><strong>💡 Suggestions :</strong> {r.texts.suggestions}</p>}
                </div>
              ))}
              {responses.length===0&&<p style={{color:'var(--gray-500)',textAlign:'center'}}>Aucune évaluation reçue.</p>}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ===== APP_URL CONSTANT (configure after deployment) ===== */
const APP_URL = "https://olivierbonnot-jpg.github.io/du-tdah/";

/* ===== ADMIN LOGIN ===== */
function AdminLogin({onLogin}){
  const [pw, setPw] = React.useState('');
  const [err, setErr] = React.useState(false);
  const check = () => {
    if(pw===ADMIN_PASSWORD) onLogin();
    else{setErr(true);setTimeout(()=>setErr(false),2000);}
  };
  return (
    <div style={{maxWidth:380,margin:'0 auto'}}>
      <div className="card">
        <div className="card-header" style={{background:'linear-gradient(135deg,#FFFBEB,#fff)',borderTop:'3px solid var(--s4)'}}>
          <h3 style={{fontWeight:700}}>🔐 Accès administrateur</h3>
        </div>
        <div className="card-body">
          {err&&<div className="alert alert-error"><span>⚠️</span>Mot de passe incorrect.</div>}
          <div className="form-group">
            <label>Mot de passe admin</label>
            <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&check()} placeholder="••••"/>
          </div>
          <button className="btn btn-primary" onClick={check} style={{width:'100%',justifyContent:'center'}}>→ Entrer</button>
        </div>
      </div>
    </div>
  );
}

/* ===== MAIN APP ===== */
function App(){
  const [user, setUser] = React.useState(getLocalUser);
  const [screen, setScreen] = React.useState(user?'home':'welcome');
  const [tab, setTab] = React.useState('resources');
  const [adminAuth, setAdminAuth] = React.useState(false);
  const [unread, setUnread] = React.useState(0);

  React.useEffect(()=>{
    if(!user) return;
    const q = db.collection("messages").where("toId","==",user.id).where("read","==",false);
    return q.onSnapshot(s=>setUnread(s.size));
  },[user]);

  const logout = () => {
    localStorage.removeItem("du_u");
    setUser(null);setScreen('welcome');setAdminAuth(false);setTab('resources');
  };

  const handleRegister = (u) => {setUser(u);setScreen('home');};
  const handleRecover = (u) => {setUser(u);setScreen('home');};

  if(screen==='welcome') return (
    <div>
      <div className="app-header"><span style={{fontSize:'1.6rem'}}>🧠</span><h1>DIU TDAH</h1><span className="badge">Université Paris-Saclay</span></div>
      <div className="container"><Welcome onRegister={()=>setScreen('register')} onLogin={handleRecover}/></div>
    </div>
  );

  if(screen==='register') return (
    <div>
      <div className="app-header"><span style={{fontSize:'1.6rem'}}>🧠</span><h1>DIU TDAH</h1><span className="badge">Inscription</span></div>
      <div className="container"><Register onDone={handleRegister}/></div>
    </div>
  );

  const navItems = [
    {id:'questionnaire',label:'📝 Évaluation'},
    {id:'resources',label:'📚 Ressources'},
    {id:'annuaire',label:'👥 Annuaire'},
    {id:'messages',label:unread>0?`✉️ Messages (${unread})`:'✉️ Messages'},
    {id:'admin',label:'⚙️ Admin'}
  ];

  return (
    <div>
      <div className="app-header">
        <span style={{fontSize:'1.6rem'}}>🧠</span>
        <div style={{flex:1}}>
          <h1>DIU TDAH</h1>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'.75rem'}}>
          <div style={{background:'rgba(255,255,255,.2)',borderRadius:'.5rem',padding:'.3rem .7rem',backdropFilter:'blur(6px)'}}>
            <div style={{color:'#fff',fontSize:'.78rem',fontWeight:700,lineHeight:1}}>{user.prenom} {user.nom}</div>
            <div style={{color:'rgba(255,255,255,.75)',fontSize:'.68rem'}}>Promo {user.promo}</div>
          </div>
          <button onClick={logout} className="btn btn-sm" style={{background:'rgba(255,255,255,.15)',color:'#fff',border:'1px solid rgba(255,255,255,.3)'}}>
            ↩ Quitter
          </button>
        </div>
      </div>
      <nav className="nav">
        {navItems.map(n=>(
          <button key={n.id} className={tab===n.id?'active':''} onClick={()=>setTab(n.id)}>{n.label}</button>
        ))}
      </nav>
      <div className="container">
        {tab==='questionnaire'&&<Questionnaire user={user}/>}
        {tab==='resources'&&<Resources user={user}/>}
        {tab==='annuaire'&&<Annuaire user={user}/>}
        {tab==='messages'&&<Messaging user={user}/>}
        {tab==='admin'&&(adminAuth?<AdminDash/>:<AdminLogin onLogin={()=>setAdminAuth(true)}/>)}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
